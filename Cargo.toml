[package]
name = "rbtop"
version = "0.3.4"
edition = "2021"
rust-version = "1.77"
description = "bashtop rewritten in Rust: fast terminal resource monitor"
license = "Apache-2.0"
repository = "https://github.com/gbomacfly/rbtop"
homepage = "https://github.com/gbomacfly/rbtop"
readme = "README.md"
keywords = ["bashtop", "top", "monitor", "tui", "system"]
categories = ["command-line-utilities"]
# what goes into the crates.io package: sources, themes, docs (no charts/bench data)
include = ["src/**/*", "themes/*.theme", "Cargo.toml", "Cargo.lock", "README.md", "README.de.md", "CHANGELOG.md", "LICENSE"]

# cargo binstall: use the release tarballs (rbtop-v<version>-<target>.tar.gz)
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo deb (release CI): Debian/Ubuntu/Proxmox packages from the musl binaries
[package.metadata.deb]
maintainer = "gbomacfly <gbomacfly@users.noreply.github.com>"
copyright = "2026, gbomacfly"
section = "admin"
priority = "optional"
extended-description = """\
rbtop is bashtop rewritten in Rust: the same layout, key bindings, config and \
themes, at a fraction of the CPU and memory. Shows cpu, memory, disks, network, \
gpu, temperatures, battery and processes (with Docker/Podman/Proxmox container \
names)."""
assets = [
    ["target/release/rbtop", "usr/bin/", "755"],
    ["themes/*.theme", "usr/share/rbtop/themes/", "644"],
    ["README.md", "usr/share/doc/rbtop/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/rbtop/CHANGELOG.md", "644"],
]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
