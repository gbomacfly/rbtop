name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - run: cargo test --release
      - run: cargo build --release
      # smoke test: binary starts and prints its version
      - run: ./target/release/rbtop --version

  # lint gate: not a dependency of the release jobs, so a new clippy lint in a
  # future stable toolchain shows up red here without blocking a release
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --release -- -D warnings

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rbtop dist/
          cp -r themes README.md README.de.md CHANGELOG.md LICENSE dist/
          tar czf rbtop-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
          f=rbtop-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          shasum -a 256 "$f" > "$f.sha256"
      - name: .deb package (static musl builds only)
        if: contains(matrix.target, 'musl')
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          # binary is already stripped (release profile); host strip can't do aarch64
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          for f in rbtop_*.deb; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^\[[0-9]/ && f { exit } /^## \[/ { if (f) exit; if (index($0, "## [" v "]") == 1) { f = 1; next } } f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            rbtop-*.tar.gz
            rbtop-*.tar.gz.sha256
            rbtop_*.deb
            rbtop_*.deb.sha256
          body_path: notes.md

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            mkdir -p dist-$t
            cp -r themes README.md README.de.md CHANGELOG.md LICENSE dist-$t/
          done
          cp target/aarch64-apple-darwin/release/rbtop dist-aarch64-apple-darwin/
          cp target/x86_64-apple-darwin/release/rbtop dist-x86_64-apple-darwin/
          lipo -create -output dist-universal-apple-darwin/rbtop \
            target/aarch64-apple-darwin/release/rbtop target/x86_64-apple-darwin/release/rbtop
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            tar czf rbtop-${{ github.ref_name }}-$t.tar.gz -C dist-$t .
            shasum -a 256 rbtop-${{ github.ref_name }}-$t.tar.gz > rbtop-${{ github.ref_name }}-$t.tar.gz.sha256
          done
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^\[[0-9]/ && f { exit } /^## \[/ { if (f) exit; if (index($0, "## [" v "]") == 1) { f = 1; next } } f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            rbtop-*.tar.gz
            rbtop-*.tar.gz.sha256
          body_path: notes.md

  # Homebrew tap: writes Formula/rbtop.rb in gbomacfly/homebrew-tap.
  # Needs the repository secret TAP_TOKEN (fine-grained token, "Contents:
  # read and write" on gbomacfly/homebrew-tap only); skipped without it.
  homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: update formula
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set, skipping"; exit 0; fi
          v="${GITHUB_REF_NAME#v}"
          mkdir sums
          gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz.sha256' --dir sums
          sh packaging/homebrew/formula.sh "$v" sums > rbtop.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/gbomacfly/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp rbtop.rb tap/Formula/rbtop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rbtop.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "rbtop $v"
          git push

  # crates.io: cargo install rbtop / cargo binstall rbtop.
  # Needs the repository secret CARGO_REGISTRY_TOKEN (crates.io API token,
  # scope publish-update for rbtop); skipped without it.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: publish
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set, skipping"; exit 0; fi
          v=$(cargo pkgid | sed 's/.*[#@]//')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
          cargo publish --locked
