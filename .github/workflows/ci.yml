name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rbtop dist/
          cp -r themes README.md LICENSE dist/
          tar czf rbtop-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: rbtop-*.tar.gz
